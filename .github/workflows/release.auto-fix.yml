
name: Release APK - Self Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install NDK + CMake + Build Tools
        run: |
          sdkmanager --install "ndk;27.0.11718014" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11718014" >> $GITHUB_ENV

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: AUTO-FIX KSP version conflict (临时补丁，就算你忘记改本地也能过)
        run: |
          echo "=== BEFORE ==="
          grep -n "ksp\|serialization" app/build.gradle.kts | head -20
          # 删除写死的版本号，让它跟 classpath 的 2.3.2 对齐
          sed -i 's/id("com.google.devtools.ksp") version ".*"/id("com.google.devtools.ksp")/' app/build.gradle.kts
          sed -i "s/id('com.google.devtools.ksp') version '.*'/id('com.google.devtools.ksp')/" app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.plugin.serialization") version ".*"/id("org.jetbrains.kotlin.plugin.serialization")/' app/build.gradle.kts
          sed -i "s/id('org.jetbrains.kotlin.plugin.serialization') version '.*'/id('org.jetbrains.kotlin.plugin.serialization')/" app/build.gradle.kts
          echo "=== AFTER ==="
          grep -n "ksp\|serialization" app/build.gradle.kts | head -20
          cat app/build.gradle.kts | head -15

      - name: Build standardRelease APK
        run: |
          ./gradlew assembleStandardRelease --stacktrace --no-daemon --no-configuration-cache -PskipShellTemplateSync=true -PallowDebugSignedRelease=true || ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          find app/build/outputs -name "*.apk" -type f | tee apk_list.txt
          APK=$(find app/build/outputs -name "*standardRelease*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs -name "*.apk" -type f | head -n 1); fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
