
name: CI - Run checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;27.0.11718014" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11718014" >> $GITHUB_ENV

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: AUTO-FIX KSP version conflict
        run: |
          echo "=== BEFORE ==="
          grep -n "ksp\|serialization" app/build.gradle.kts | head -20
          sed -i 's/id("com.google.devtools.ksp") version ".*"/id("com.google.devtools.ksp")/' app/build.gradle.kts
          sed -i "s/id('com.google.devtools.ksp') version '.*'/id('com.google.devtools.ksp')/" app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.plugin.serialization") version ".*"/id("org.jetbrains.kotlin.plugin.serialization")/' app/build.gradle.kts
          sed -i "s/id('org.jetbrains.kotlin.plugin.serialization') version '.*'/id('org.jetbrains.kotlin.plugin.serialization')/" app/build.gradle.kts
          # Also fix if it's in libs.versions.toml
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/ksp = "2.1.0-1.0.29"/ksp = "2.3.2"/' gradle/libs.versions.toml || true
            sed -i 's/ksp = "2.1.0.*/ksp = "2.3.2"/' gradle/libs.versions.toml || true
          fi
          echo "=== AFTER ==="
          grep -n "ksp\|serialization" app/build.gradle.kts | head -20

      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin \
            :app:testStandardDebugUnitTest \
            :app:checkConfigFieldDrift --stacktrace
