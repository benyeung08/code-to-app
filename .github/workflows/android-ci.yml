name: Android CI Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  # Group per ref AND event type: routine pushes to the same branch still cancel
  # their superseded check runs, but a workflow_dispatch packaging run is never
  # cancelled by a merge push landing on the same ref mid-build.
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Gradle version
        run: ./gradlew --version | head -12

      - name: Run app compile
        id: compile_app
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PskipStackBundlesSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin 2>&1 | tee compile-app.log

      - name: Run shell compile
        id: compile_shell
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PskipStackBundlesSync=true \
            :shell:compileDebugKotlin 2>&1 | tee compile-shell.log

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PskipStackBundlesSync=true \
            -PallowDebugSignedRelease=true \
            :app:testStandardDebugUnitTest 2>&1 | tee unit-test.log

      # 把真正的报错写进 Job Summary —— GitHub 网页端会截断大段日志，
      # 但 Summary 不会被截断，手机上直接往下滚就能看到。
      - name: Publish error summary
        if: failure()
        run: |
          {
            echo "## Gradle 报错摘要"
            echo
            echo "### 1. What went wrong"
            echo '```'
            grep -E "What went wrong:|FAILURE:" -A 15 compile-app.log compile-shell.log unit-test.log 2>/dev/null | head -60
            echo '```'
            echo
            echo "### 2. Kotlin 编译错误 (前 40 条)"
            echo '```'
            grep -hE "^e: " compile-app.log compile-shell.log unit-test.log 2>/dev/null | sort -u | head -40
            echo '```'
            echo
            echo "### 3. 失败的 task / 测试"
            echo '```'
            grep -hE "FAILED|Execution failed for task|There were failing tests" compile-app.log compile-shell.log unit-test.log 2>/dev/null | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_number }}
          path: |
            compile-app.log
            compile-shell.log
            unit-test.log
          if-no-files-found: ignore
          retention-days: 7

  package-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      # ⚠️ 已删除 :app:assembleGplayDebug / assembleGplayRelease
      # 简化版 app 模块只有 standard 一个 flavor，没有 gplay。
      - name: Build APKs
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardDebug \
            :app:assembleStandardRelease \
            :shell:assembleDebug \
            :shell:assembleRelease

      # ⚠️ 已删除 Build generated demo APK / Upload generated demo APK / Upload gplay APKs
      # 简化版 app 模块没有 com.webtoapp.core.apkbuilder.DemoApkExportTest，也没有 gplay 产物。
      - name: Upload standard APKs
        uses: actions/upload-artifact@v4
        with:
          name: standard-apks-DEBUG-SIGNED-do-not-distribute-${{ github.run_number }}
          path: |
            app/build/outputs/apk/standard/**/*.apk
            shell/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
