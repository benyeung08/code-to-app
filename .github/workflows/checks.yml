name: checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "Using preinstalled SDK at $ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          TOOL=$(ls $ANDROID_HOME/cmdline-tools | sort -V | tail -n1)
          export PATH=$ANDROID_HOME/cmdline-tools/$TOOL/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # ⚠️ 已删除 :app:checkConfigFieldDrift —— 该 task 定义在上游 app/build.gradle.kts，
      # 你已用简化版 app 模块覆盖，task 不存在，Gradle 会直接报 Task not found。
      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PskipStackBundlesSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin \
            :app:testStandardDebugUnitTest --stacktrace
