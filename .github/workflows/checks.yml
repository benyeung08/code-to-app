
name: checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (no setup-android@v3, use preinstalled SDK)
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME/cmdline-tools/
          # use latest cmdline-tools
          export CMDLINE_TOOL=$(ls $ANDROID_HOME/cmdline-tools | sort -V | tail -n 1)
          echo "Using $CMDLINE_TOOL"
          export PATH=$ANDROID_HOME/cmdline-tools/$CMDLINE_TOOL/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11718014" >> $GITHUB_ENV
          sdkmanager --list_installed | tail -20

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: AUTO-FIX KSP 2.1.0 -> 2.3.2
        run: |
          echo "=== BEFORE FIX ==="
          grep -n "ksp\|serialization\|kotlin" app/build.gradle.kts | head -30 || true
          # Remove hardcoded versions
          sed -i 's/id("com.google.devtools.ksp") version ".*"/id("com.google.devtools.ksp")/' app/build.gradle.kts
          sed -i "s/id('com.google.devtools.ksp') version '.*'/id('com.google.devtools.ksp')/" app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.plugin.serialization") version ".*"/id("org.jetbrains.kotlin.plugin.serialization")/' app/build.gradle.kts
          sed -i "s/id('org.jetbrains.kotlin.plugin.serialization') version '.*'/id('org.jetbrains.kotlin.plugin.serialization')/" app/build.gradle.kts
          # Fix in version catalog if exists
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/2\.1\.0-1\.0\.29/2.3.2/g' gradle/libs.versions.toml || true
            sed -i 's/2\.1\.0/2.3.0/g' gradle/libs.versions.toml || true
          fi
          echo "=== AFTER FIX ==="
          grep -n "ksp\|serialization" app/build.gradle.kts | head -20

      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin \
            :app:testStandardDebugUnitTest \
            :app:checkConfigFieldDrift --stacktrace
